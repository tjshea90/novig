name: Grade the engine's scan study (results, closing lines, the engine's own orders)

# Tj, 2026-10-15 (TCL20e): "log every scanned +EV line ... then closing odds and result (won/lost/pushed) filled in retroactively by a scheduled GitHub grader, feeding the daily review digest".
# The engine's runs write the scan study (every bet each finished scan lists, in the app's own journal format) as study-<game day>-run<id>.jsonl.gz to the day's cloud-archive Release. This job puts the segments
# together (tools/engine_study.py), runs the app's OWN grading over them (cloud/GradeMain.kt: ScanStudy.settle, scores and closing lines; free sources, plus SportsGameOdds when its secret exists), and uploads ONLY the
# lines it added as grades-<game day>-run<this run>.jsonl.gz to the `engine-grades` Release (nothing already stored is ever rewritten; never delete it). The engine's own orders (trades.json on cloud-feed) are settled from
# the same results into trade-results.json on the `engine-results` branch (one force-pushed commit; the engine reads it at its start and every 30 minutes). The daily review digest reads the assembled journal.
# It places no order and holds no trading key.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 7,17 * * *"

permissions:
  contents: write

concurrency:
  group: engine-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download every study segment and every grade segment
        run: |
          mkdir -p assets bidassets
          for TAG in $(gh release list --limit 500 --json tagName --jq '.[].tagName' | grep '^cloud-archive-' || true); do
            gh release download "$TAG" -p 'study-*' -D assets --clobber 2>/dev/null || true
            gh release download "$TAG" -p 'bids-*' -D bidassets --clobber 2>/dev/null || true
          done
          gh release download engine-grades -p 'grades-*' -D assets --clobber 2>/dev/null || echo "no grades yet"
          echo "segments downloaded: $(ls assets | wc -l)"

      - name: Put them together
        run: python3 -I tools/engine_study.py assemble assets journal

      - name: The engine's orders (trades.json on cloud-feed)
        run: |
          if git fetch -q --depth=1 origin cloud-feed 2>/dev/null && git show FETCH_HEAD:trades.json > trades.json 2>/dev/null; then echo "trades.json: $(wc -c < trades.json) bytes"; else echo '{}' > trades.json; echo "no trades.json yet"; fi

      - name: Grade
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: |
          set -o pipefail
          ls journal/*.jsonl >/dev/null 2>&1 || { echo "no study journal yet: nothing to grade"; mkdir -p newgrades; exit 0; }
          ./gradlew :cloud:grade --no-daemon --console=plain --args="--journal $PWD/journal --new $PWD/newgrades --trades $PWD/trades.json --results $PWD/trade-results.json" 2>&1 | tail -n 60

      - name: Keep what the grader added (the engine-grades Release; nothing is rewritten)
        run: |
          python3 -I tools/engine_study.py pack newgrades "${GITHUB_RUN_ID}" packed
          ls packed/* >/dev/null 2>&1 || { echo "nothing new to keep"; exit 0; }
          gh release view engine-grades >/dev/null 2>&1 || gh release create engine-grades --title "Engine study grades" --prerelease --latest=false --target main --notes "Result and closing-line lines the daily grader added to the engine's scan study (.github/workflows/engine-grade.yml). Permanent: never delete."
          gh release upload engine-grades packed/* --clobber

      - name: "Flat datasets for Claude (derived, rebuilt whole each run, the engine-dataset Release)"
        run: |
          python3 -I tools/lines_dataset.py lines journal dataset || true
          python3 -I tools/lines_dataset.py bids bidassets dataset || true
          python3 -I tools/lines_dataset.py dictionary > dataset/DATA_DICTIONARY.md
          ls dataset/* >/dev/null 2>&1 || { echo "nothing to publish"; exit 0; }
          gh release view engine-dataset >/dev/null 2>&1 || gh release create engine-dataset --title "Engine datasets (flat, for analysis)" --prerelease --latest=false --target main --notes "Derived, flat CSVs of every bet the engine's scan saw (shown or not) with odds, lead time, EV, books agreeing, sharp agreement, stars, closing line and result, and of every bid it posted. Rebuilt twice a day by engine-grade.yml from the permanent journals (cloud-archive-*, engine-grades); see DATA_DICTIONARY.md. Safe to read and to replace; the journals are the record."
          gh release upload engine-dataset dataset/* --clobber

      - name: Publish the engine's settled orders (engine-results branch, one force-pushed commit)
        run: |
          [ -s trade-results.json ] || { echo "no results file"; exit 0; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf er && mkdir er && cd er
          git init -q && git checkout -q --orphan engine-results
          cp ../trade-results.json .
          git add -A && git commit -q -m "engine trade results $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" engine-results

      - name: Summary
        if: always()
        run: |
          { echo '### Engine study grading'; echo "segments: $(ls assets 2>/dev/null | wc -l), day files: $(ls journal 2>/dev/null | wc -l), new grade files: $(ls packed 2>/dev/null | wc -l)"; } >> "$GITHUB_STEP_SUMMARY"
