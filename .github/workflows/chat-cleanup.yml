name: Clean up chat attachments (Tj, 2026-10-16)

# Attachments Tj adds in the app's chat (screenshots, files) are stored as chat-files/<message id>-<name> on the `chat-files` branch so Claude can read them (`tools/tell_tj.py chat-file`). This hourly job deletes the ones
# older than 24 hours unless a Claude session flagged the message important (`tools/tell_tj.py chat-keep <message id>` writes chat-keep/<id> on cloud-config). The branch is rebuilt as ONE commit and force-pushed (with a
# lease, so a file the phone adds while this runs is never lost: the push just fails and retries next hour), so a deleted attachment is gone from GitHub, history included. Only this branch is touched; the chat's text stays.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: chat-cleanup
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebuild the chat-files branch without the old, unflagged attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir work && cd work && git init -q
          git remote add origin "$URL"
          if ! git fetch -q --depth=1 origin chat-files 2>/dev/null; then echo "no chat-files branch yet"; exit 0; fi
          LEASE=$(git rev-parse FETCH_HEAD)
          git checkout -q -B rebuilt FETCH_HEAD
          KEEP=$(git ls-remote --heads "$URL" cloud-config >/dev/null 2>&1 && { git fetch -q --depth=1 origin cloud-config && git ls-tree --name-only FETCH_HEAD chat-keep/ | sed 's|chat-keep/||'; } || true)
          python3 - "$KEEP" <<'PY'
          import os, re, sys, time
          keep = set(sys.argv[1].split())
          now = time.time() * 1000
          gone = 0
          d = "chat-files"
          if os.path.isdir(d):
              for f in sorted(os.listdir(d)):
                  m = re.match(r"^(t(\d{13}))-", f)
                  if not m:
                      continue
                  if m.group(1) not in keep and now - int(m.group(2)) > 24 * 3600 * 1000:
                      os.remove(os.path.join(d, f)); gone += 1
          print("deleted", gone)
          PY
          git add -A
          git commit -q --amend --no-edit -m "chat attachments $(date -u +%FT%TZ)" --allow-empty
          # one commit with no parent: the deleted files are not reachable any more
          TREE=$(git rev-parse HEAD^{tree})
          NEW=$(git commit-tree "$TREE" -m "chat attachments $(date -u +%FT%TZ)")
          git push -q --force-with-lease=chat-files:"$LEASE" origin "$NEW":refs/heads/chat-files || echo "branch moved while cleaning (a new attachment); next hour"
