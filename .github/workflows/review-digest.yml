name: Daily review of every scanned +EV bet

# Tj, 2026-10-15: "I want Claude to do scheduled diagnostics and improvements in vigilant. I want it to log and review all scanned positive EV bets and look for patterns and what really is profitable."
# This is the MECHANICAL half, done by GitHub for free (CLAUDE.md, "Use every free GitHub tool"): it runs the app's own scan-study report (cloud/ReviewMain.kt -> StudyExport) over the journals the phone saved to the
# phone-data branch (every bet any scan listed, graded, with its closing line), adds the profit-by-type table for the bets Tj actually placed (tools/profit_types.py), and APPENDS the result to the review-digest branch
# (never force-pushed: `latest.txt` and `digest/<date>.txt`). A scheduled Claude session then only READS the digest, which costs a fraction of crunching the journals itself. It places no order and uses no secret.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"

permissions:
  contents: write

concurrency:
  group: review-digest
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: The phone's saved journals (phone-data branch)
        uses: actions/checkout@v4
        with:
          ref: phone-data
          path: pd
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Review
        run: |
          set -e
          mkdir -p out
          ./gradlew :cloud:review --args="$PWD/pd $PWD/out/study.txt" --no-daemon -q
          {
            cat out/study.txt
            echo
            echo "== BETS TJ PLACED: profit by type (tools/profit_types.py over phone/bets; ROI is noisy, read the t-statistics; n under 40 says little) =="
            ls pd/phone/bets/*.jsonl >/dev/null 2>&1 && python3 tools/profit_types.py pd/phone/bets/*.jsonl 2>&1 | head -400 || echo "no placed-bet files on phone-data yet"
            # The same bets split at v0.99.4 (PropHaircut -7/-3 points, Profit-proven only on): did the fix close the gap? Judge it only with 200+ settled prop bets on the AFTER side.
            python3 -I - <<'PY'
          import glob, json, os
          def ver(b):
              try: return tuple(int(x) for x in str(b.get("appVersion", "0")).split("."))
              except Exception: return (0,)
          rows, vmap = [], {}
          for f in sorted(glob.glob("pd/phone/bets/*.jsonl")):
              for line in open(f, encoding="utf-8"):
                  line = line.strip()
                  if not line.startswith("{"): continue
                  try: b = json.loads(line)
                  except Exception: continue
                  rows.append((b, line))
                  if "id" in b and "appVersion" in b: vmap[b["id"]] = ver(b)
          before, after = [], []
          # a bet belongs to the version it was placed under, whichever of its lines carries the field
          for b, line in rows:
              (after if vmap.get(b.get("id"), ver(b)) >= (0, 99, 4) else before).append(line)
          for name, rows in (("before", before), ("after", after)):
              with open("out/bets-" + name + ".jsonl", "w", encoding="utf-8") as o: o.write("\n".join(rows) + ("\n" if rows else ""))
              print(f"\n== PLACED BETS {name.upper()} v0.99.4 (prop haircut): {len(rows)} records ==")
          PY
            for part in before after; do
              echo; echo "== PLACED BETS $part v0.99.4: profit by type =="
              [ -s out/bets-$part.jsonl ] && python3 tools/profit_types.py out/bets-$part.jsonl 2>&1 | head -120 || echo "none"
            done
          } > out/latest.txt
          wc -c out/latest.txt

      # The engine's OWN record (TCL20e): every bet each finished GitHub scan listed, in the app's study format, with the results and closing lines engine-grade.yml added; and the engine's own orders.
      - name: The engine's own scan study and orders
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          for TAG in $(gh release list --limit 500 --json tagName --jq '.[].tagName' | grep '^cloud-archive-' || true); do
            gh release download "$TAG" -p 'study-*' -D assets --clobber 2>/dev/null || true
          done
          gh release download engine-grades -p 'grades-*' -D assets --clobber 2>/dev/null || true
          python3 -I tools/engine_study.py assemble assets eng/phone/study
          {
            echo
            echo "== THE ENGINE'S OWN SCAN STUDY (GitHub's record of every bet its scans listed, graded by engine-grade.yml; same report as above; cut at 90000 characters) =="
            if ls eng/phone/study/study-*.jsonl >/dev/null 2>&1; then
              ./gradlew :cloud:review --args="$PWD/eng $PWD/out/engine-study.txt" --no-daemon -q
              head -c 90000 out/engine-study.txt
            else
              echo "no engine study segments yet (the engine writes them while it runs, 08:00-22:00 Eastern)"
            fi
            echo
            echo "== THE ENGINE'S OWN ORDERS (trades.json on cloud-feed: paper or live, settled by engine-grade.yml) =="
            if git fetch -q --depth=1 origin cloud-feed 2>/dev/null && git show FETCH_HEAD:trades.json > trades.json 2>/dev/null; then python3 -I tools/trade_summary.py trades.json; else echo "no trades.json yet"; fi
            echo
            # By ORIGIN (TCL69): manual / phone-auto / phone-bid / engine-auto / engine-bid, so the rules are judged only on the bets the engine and the phone's auto-bet took, never on Tj's hand bets.
            python3 -I tools/bets_dataset.py table --phone "pd/phone/bets/*.jsonl" $( [ -f trades.json ] && echo --engine trades.json ) || echo "origin table failed"
          } >> out/latest.txt
          wc -c out/latest.txt

      - name: Append to the review-digest branch (never forced)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DAY="$(date -u +%Y-%m-%d)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone -q --depth 1 --branch review-digest "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rd 2>/dev/null || {
            git init -q rd
            git -C rd checkout -q --orphan review-digest
            git -C rd remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            printf '%s\n' "# review-digest" "" "Written by .github/workflows/review-digest.yml, never force-pushed. latest.txt is the newest digest, digest/<date>.txt keeps each day. Read by the scheduled Claude review (CLAUDE.md, TASKS.md TCL18)." > rd/README.md
          }
          mkdir -p rd/digest
          cp out/latest.txt rd/latest.txt
          cp out/latest.txt "rd/digest/${DAY}.txt"
          git -C rd add -A
          git -C rd commit -q -m "review digest ${DAY}" || { echo "nothing new"; exit 0; }
          git -C rd push -q origin review-digest
          echo "pushed review digest ${DAY}"
