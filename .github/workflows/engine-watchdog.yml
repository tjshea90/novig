name: Engine watchdog (Tj, 2026-10-16)

# A hung engine job (it said "ending" and never handed over, 2026-10-16) is cancelled and replaced automatically: tools/engine_watchdog.py. Every 10 minutes, free, no Claude usage.
# It acts only while the phone's switch is on and the dead-man STOP is not set; see the file's header for the rules.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: engine-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Look for a stuck engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -I tools/engine_watchdog.py selftest
          python3 -I tools/engine_watchdog.py check
