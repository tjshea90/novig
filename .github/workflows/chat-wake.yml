# chat-wake.yml - lives on the `cloud-config` branch (a push workflow runs from the pushed branch's own files), source copy: tools/chat-wake/ on main.
# When Tj's app chat writes a file under chat/, wait 40 s; if no live Claude session has acked or answered it, wake the on-duty account's routine (API trigger) and say so in the chat.
# Free (public repo), zero Claude usage while nobody writes. TCL70, Tj 2026-10-17. Logic and tests: tools/chat_wake.py on main.
name: Chat wake
on:
  push:
    paths: ['chat/**']
concurrency:
  group: chat-wake
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Wake the on-duty Claude if nobody answers
        env:
          CLAUDE_FIRE_7542BF_URL: ${{ secrets.CLAUDE_FIRE_7542BF_URL }}
          CLAUDE_FIRE_7542BF_TOKEN: ${{ secrets.CLAUDE_FIRE_7542BF_TOKEN }}
          CLAUDE_FIRE_27A37E_URL: ${{ secrets.CLAUDE_FIRE_27A37E_URL }}
          CLAUDE_FIRE_27A37E_TOKEN: ${{ secrets.CLAUDE_FIRE_27A37E_TOKEN }}
          CLAUDE_FIRE_5D1E2D_URL: ${{ secrets.CLAUDE_FIRE_5D1E2D_URL }}
          CLAUDE_FIRE_5D1E2D_TOKEN: ${{ secrets.CLAUDE_FIRE_5D1E2D_TOKEN }}
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git fetch -q origin claude-coord:refs/remotes/origin/claude-coord || true
          python3 -I tools/chat_wake.py run
