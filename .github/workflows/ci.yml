name: CI

# Build+test verification — this is the ONLY place the Android `app` module actually gets
# compiled right now. The dev container this project is built in has no Android SDK (see
# BRIEF.md's Toolchain section), so `engine` and `data` (plain Kotlin/JVM modules) are verified
# locally with real unit tests, but `app` (Compose UI, AndroidManifest, etc.) is unverified until
# this workflow runs. This is a debug/test build only — no signing, no release, no keystore. That
# comes later per BRIEF.md's "Releasing" section, once a keystore exists.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        # GitHub-hosted ubuntu runners already ship an Android SDK with ANDROID_HOME set — no
        # separate SDK-install action needed. (android-actions/setup-android@v3 was tried first
        # and fails outright: it unconditionally tries to install the long-removed legacy "tools"
        # package and crashes the whole step — a known issue with that action, not a problem with
        # this project's own code. Writing the well-known license hashes directly is more robust
        # than depending on that action or guessing at a cmdline-tools path.) With licenses
        # accepted, AGP auto-downloads whatever specific platform/build-tools compileSdk 36 needs
        # during the Gradle build itself.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine, data, app)
        run: ./gradlew test --console=plain

      - name: Debug build (app module — proves the Compose UI/manifest actually compile)
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vigilant-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
