name: CI

# Build+test verification on a clean machine. (Since 2026-09-25 a session can also build `app`
# locally by installing the Android SDK to /opt/android-sdk — see BRIEF.md's Build traps — but
# this workflow stays the authority on what's actually green.) This builds the debug variant only — no release, no tag, no GitHub Release.
# For an actual signed, installable release, see release.yml (BRIEF.md's "Releasing" section).

on:
  push:
  pull_request:
  workflow_dispatch:

# The autosave hook pushes after every edit, so a newer push supersedes an older run: cancel it
# instead of queueing dozens of identical builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        # GitHub-hosted ubuntu runners already ship an Android SDK with ANDROID_HOME set — no
        # separate SDK-install action needed. (android-actions/setup-android@v3 was tried first
        # and fails outright: it unconditionally tries to install the long-removed legacy "tools"
        # package and crashes the whole step — a known issue with that action, not a problem with
        # this project's own code. Writing the well-known license hashes directly is more robust
        # than depending on that action or guessing at a cmdline-tools path.) With licenses
        # accepted, AGP auto-downloads whatever specific platform/build-tools compileSdk 36 needs
        # during the Gradle build itself.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric's Android runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests (engine, data, app incl. Robolectric UI tests)
        run: ./gradlew test --console=plain

      - name: Debug build (app module — proves the Compose UI/manifest actually compile)
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vigilant-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
