name: CI

# Build+test verification — this is the ONLY place the Android `app` module actually gets
# compiled right now. The dev container this project is built in has no Android SDK (see
# BRIEF.md's Toolchain section), so `engine` and `data` (plain Kotlin/JVM modules) are verified
# locally with real unit tests, but `app` (Compose UI, AndroidManifest, etc.) is unverified until
# this workflow runs. This is a debug/test build only — no signing, no release, no keystore. That
# comes later per BRIEF.md's "Releasing" section, once a keystore exists.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine, data, app)
        run: ./gradlew test --console=plain

      - name: Debug build (app module — proves the Compose UI/manifest actually compile)
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vigilant-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
