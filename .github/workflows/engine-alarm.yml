name: Engine alarm (08:00 ET start, Tj 2026-10-19)

# Tj, 2026-10-19: "Did it start at 8am as scheduled? If not, when did it start and why?" It did not: it started at 11:04 ET when his phone asked. GitHub ran cloud-scan.yml's 15-minute
# timer only 3 to 8 times a day (research/engine_start_2026-10-19.md), and nothing else started the morning engine. A dispatched run is delivered; a timer tick is best effort.
# So this job waits on a free runner until the next 08:00 America/New_York and dispatches cloud-scan.yml, whose gate still decides (the phone's switch, the hours, a manual stop, the kill
# switch). A job may run 6 h, so a longer wait hands over to a new alarm (tools/engine_alarm.py). Armed by the engine when its hours close or the phone switches it off, by cloud-scan's gate
# whenever it finds the hours closed, and by the watchdog when none waits. One alarm at a time: a newer one replaces the waiting one. It starts nothing while the dead-man STOP is set, and the
# dead-man disables it like every other workflow. The timer below is only a backstop.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: engine-alarm
  cancel-in-progress: true

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: tools
      - name: Wait for 08:00 ET, then start the engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I tools/engine_alarm.py selftest
          python3 -I -u tools/engine_alarm.py run
