name: PropLine Pro (Tj, 2026-10-16)

# Free, no Claude usage. Tj's PropLine Pro key (25,000 requests a day, resolved-prop exports) is one of the keys in the PROPLINE_API_KEY secret (the phone's "send my API keys" writes them all);
# tools/propline.py finds the paid one by its own X-Daily-Limit. Tasks (workflow_dispatch):
#   plans    which key is paid, what it unlocks (log only)
#   probe    one call to every Pro endpoint on a real event; the answers (keyless) go to the `propline-samples` Release so the app's parsers can be checked against real shapes
#   archive  the resolved-prop archive: /v1/exports/resolved-props per sport (gzip CSV with closing AND opening lines) + the free accuracy report, to a `propline-archive-YYYY-MM-DD` Release (never delete)
#   backfill archive over the whole 90 days Pro can reach (run once when the key arrives)
#   clv      closing-line value of every bet the engine saw (Release `engine-dataset` lines-*.csv.gz) against PropLine's archive (Pinnacle's devigged close, Novig's own close, the grade): tools/propline_clv.py
#            -> Release `propline-clv` (propline-clv.csv.gz + propline-clv.md, replaced each run)
# The schedule runs `archive` daily (window: the last 3 days, so a late grade is never missed; rows repeat across days, join on outcome_id).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "plans | probe | speed | archive | backfill | clv | timing"
        default: "plans"
  schedule:
    - cron: "37 9 * * *"

permissions:
  contents: write

concurrency:
  group: propline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: PropLine task
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ github.event.inputs.task || 'archive' }}
        run: |
          set -u
          python3 -I tools/propline.py selftest
          day=$(date -u +%F)
          case "$TASK" in
            plans) python3 -I tools/propline.py plans ;;
            probe)
              python3 -I tools/propline.py probe out/probe
              if [ -f out/probe/REPORT.txt ]; then
                gh release view propline-samples >/dev/null 2>&1 || gh release create propline-samples --title "PropLine Pro samples (keyless)" --notes "Real answers of every Pro endpoint, trimmed; written by .github/workflows/propline.yml (task probe)."
                gh release upload propline-samples out/probe/* --clobber
              fi ;;
            speed)
              python3 -I tools/propline.py speed out/speed
              gh release view propline-samples >/dev/null 2>&1 || gh release create propline-samples --title "PropLine Pro samples (keyless)" --notes "Real answers of every Pro endpoint, trimmed."
              gh release upload propline-samples out/speed/speed.txt --clobber ;;
            archive|backfill)
              if [ "$TASK" = backfill ]; then days=90; else days=3; fi
              python3 -I tools/propline.py archive out/archive --days "$days"
              if ls out/archive/*.csv.gz >/dev/null 2>&1; then
                tag="propline-archive-$day"
                gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "PropLine resolved-prop archive $day" --notes "Resolved props with closing and opening lines (Pro export). Never delete. Filter the (Watermark) canary rows."
                gh release upload "$tag" out/archive/* --clobber
              fi ;;
            clv) bash tools/propline_clv_job.sh ;;
            timing)
              # Timing study (TCL68): Novig's price at 72..1 h before the start against Pinnacle's close and the real result; needs the archive Release's CSVs.
              tag=$(gh release list --limit 30 --json tagName --jq '.[].tagName' | grep '^propline-archive-' | sort | tail -1)
              mkdir -p out/arch && gh release download "$tag" --pattern 'resolved-*.csv.gz' --dir out/arch
              python3 -I tools/propline_timing_study.py selftest
              python3 -I tools/propline_timing_study.py run out/arch out/timing --events 500
              gh release view propline-timing >/dev/null 2>&1 || gh release create propline-timing --title "PropLine timing study" --notes "Novig price at each lead time vs Pinnacle's close and the result (tools/propline_timing_study.py). Replaced each run."
              gh release upload propline-timing out/timing/* --clobber ;;
          esac
      - name: CLV after the daily archive
        if: ${{ github.event_name == 'schedule' || github.event.inputs.task == 'archive' || github.event.inputs.task == 'backfill' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/propline_clv_job.sh
