name: PropLine Pro (Tj, 2026-10-16)

# Free, no Claude usage. Tj's PropLine Pro key (25,000 requests a day, resolved-prop exports) is one of the keys in the PROPLINE_API_KEY secret (the phone's "send my API keys" writes them all);
# tools/propline.py finds the paid one by its own X-Daily-Limit. Tasks (workflow_dispatch):
#   plans    which key is paid, what it unlocks (log only)
#   probe    one call to every Pro endpoint on a real event; the answers (keyless) go to the `propline-samples` Release so the app's parsers can be checked against real shapes
#   archive  the resolved-prop archive: /v1/exports/resolved-props per sport (gzip CSV with closing AND opening lines) + the free accuracy report, to a `propline-archive-YYYY-MM-DD` Release (never delete)
#   backfill archive over the whole 90 days Pro can reach (run once when the key arrives)
#   clv      closing-line value of every bet the engine saw (Release `engine-dataset` lines-*.csv.gz) against PropLine's archive (Pinnacle's devigged close, Novig's own close, the grade): tools/propline_clv.py
#            -> Release `propline-clv` (propline-clv.csv.gz + propline-clv.md, replaced each run)
#   grade    Tj's REAL bets and bids (phone-data hand/phone bets + the engine's trades.json) graded against the close by PropLine's own POST /v1/clv/grade (PS3, Tj 2026-10-25)
#            -> Release `propline-grade` (graded.csv.gz + SUMMARY.md, replaced each run; runs daily after the archive)
# The schedule runs `archive` daily (window: the last 3 days, so a late grade is never missed; rows repeat across days, join on outcome_id).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "plans | probe | speed | archive | backfill | multibook | clv | grade | timing | evbets | accuracy | coverage"
        default: "plans"
  schedule:
    - cron: "37 9 * * *"

permissions:
  contents: write

concurrency:
  group: propline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: PropLine task
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ github.event.inputs.task || 'archive' }}
        run: |
          set -u
          python3 -I tools/propline.py selftest
          day=$(date -u +%F)
          case "$TASK" in
            plans) python3 -I tools/propline.py plans ;;
            probe)
              python3 -I tools/propline.py probe out/probe
              if [ -f out/probe/REPORT.txt ]; then
                gh release view propline-samples >/dev/null 2>&1 || gh release create propline-samples --title "PropLine Pro samples (keyless)" --notes "Real answers of every Pro endpoint, trimmed; written by .github/workflows/propline.yml (task probe)."
                gh release upload propline-samples out/probe/* --clobber
              fi ;;
            speed)
              python3 -I tools/propline.py speed out/speed
              gh release view propline-samples >/dev/null 2>&1 || gh release create propline-samples --title "PropLine Pro samples (keyless)" --notes "Real answers of every Pro endpoint, trimmed."
              gh release upload propline-samples out/speed/speed.txt --clobber ;;
            archive|backfill)
              if [ "$TASK" = backfill ]; then days=90; else days=3; fi
              python3 -I tools/propline.py archive out/archive --days "$days"
              if ls out/archive/*.csv.gz >/dev/null 2>&1; then
                tag="propline-archive-$day"
                gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "PropLine resolved-prop archive $day" --notes "Resolved props with closing and opening lines (Pro export). Never delete. Filter the (Watermark) canary rows."
                gh release upload "$tag" out/archive/* --clobber
              fi ;;
            multibook)
              # SX (2026-10-24): 90 days of the US books' resolved props (open + close + result) beside the Novig/Pinnacle archive, for the star study: 7 sports x 6 books = 42 export calls.
              python3 -I tools/propline.py archive out/multibook --days 90 --books draftkings,fanduel,betmgm,williamhill_us,espnbet,bovada --sports baseball_mlb,basketball_nba,basketball_wnba,hockey_nhl,football_nfl,football_ncaaf,basketball_ncaab
              if ls out/multibook/*.csv.gz >/dev/null 2>&1; then
                tag="propline-multibook-$day"
                gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "PropLine resolved props, US books, $day" --notes "90 days of the US books' resolved props with opening and closing lines (Pro export), for the star study (SX). Never delete. Filter the (Watermark) canary rows."
                gh release upload "$tag" out/multibook/* --clobber
              fi ;;
            accuracy)
              # PL-OA (2026-10-24): free-tier reports from the OpenAPI spec: which books price props closest to the result, per-book freshness, odds-history coverage, injury changes.
              mkdir -p out/accuracy
              # the secret holds several keys, comma separated: ask with each until one is accepted
              pl() { for k in $(echo "$PROPLINE_API_KEY" | tr ',' ' '); do curl -sS -m 60 -H "X-API-Key: $k" "$1" -o "$2" || true; grep -q '"invalid_api_key"' "$2" || break; done; }
              for s in basketball_nba baseball_mlb icehockey_nhl americanfootball_nfl; do
                pl "https://api.prop-line.com/v1/books/accuracy?sport=$s&days=90" "out/accuracy/accuracy-$s.json"
                pl "https://api.prop-line.com/v1/coverage/history?sport=$s" "out/accuracy/coverage-$s.json"
                pl "https://api.prop-line.com/v1/sports/$s/injuries/history?days=30" "out/accuracy/injuries-$s.json"
              done
              curl -sS -m 60 "https://api.prop-line.com/v1/freshness" -o out/accuracy/freshness.json || true
              pl "https://api.prop-line.com/v1/markets/hit-rates?days=90" out/accuracy/hit-rates.json
              gh release view propline-samples >/dev/null 2>&1 || gh release create propline-samples --title "PropLine Pro samples (keyless)" --notes "Real answers of PropLine endpoints, keyless."
              gh release upload propline-samples out/accuracy/* --clobber ;;
            coverage)
              # PS2 (2026-10-25): which books price the scanned leagues, how many post Novig's own line numbers, and which books share one odds desk (identical prices).
              python3 -I tools/propline.py coverage out/coverage
              gh release view propline-samples >/dev/null 2>&1 || gh release create propline-samples --title "PropLine samples (keyless)" --notes "Real answers of PropLine endpoints, keyless."
              gh release upload propline-samples out/coverage/* --clobber ;;
            proppin)
              python3 -I tools/propline.py proppin out/proppin
              gh release upload propline-samples out/proppin/* --clobber ;;
            altprobe)
              # PX (2026-10-25): Novig's alternate spread/total rungs vs the books Vigilant reads at the same number, with ages and market shapes.
              python3 -I tools/propline.py altprobe out/altprobe
              gh release view propline-samples >/dev/null 2>&1 || gh release create propline-samples --title "PropLine samples (keyless)" --notes "Real answers of PropLine endpoints, keyless."
              gh release upload propline-samples out/altprobe/* --clobber ;;
            clv) bash tools/propline_clv_job.sh ;;
            grade) bash tools/propline_grade_job.sh ;;
            evbets) bash tools/propline_evbets_job.sh ;;
            timing)
              # Timing study (TCL68): Novig's price at 72..1 h before the start against Pinnacle's close and the real result; needs the archive Release's CSVs.
              tag=$(gh release list --limit 30 --json tagName --jq '.[].tagName' | grep '^propline-archive-' | sort | tail -1)
              mkdir -p out/arch && gh release download "$tag" --pattern 'resolved-*.csv.gz' --dir out/arch
              python3 -I tools/propline_timing_study.py selftest
              python3 -I tools/propline_timing_study.py run out/arch out/timing --events 500
              gh release view propline-timing >/dev/null 2>&1 || gh release create propline-timing --title "PropLine timing study" --notes "Novig price at each lead time vs Pinnacle's close and the result (tools/propline_timing_study.py). Replaced each run."
              gh release upload propline-timing out/timing/* --clobber ;;
          esac
      - name: CLV after the daily archive
        if: ${{ github.event_name == 'schedule' || github.event.inputs.task == 'archive' || github.event.inputs.task == 'backfill' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/propline_clv_job.sh
      - name: Real bets graded against the close by PropLine (PS3)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.task == 'archive' }}
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/propline_grade_job.sh || echo "grade job failed (not fatal)"
      - name: PropLine +EV bets graded and reported (TCL75)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.task == 'archive' || github.event.inputs.task == 'backfill' || github.event.inputs.task == 'evbets' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/propline_evbets_job.sh
