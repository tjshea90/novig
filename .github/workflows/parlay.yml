name: ParlayAPI Pro (Tj, 2026-10-20)

# Free, no Claude usage. Tj's ParlayAPI Pro key is one of the keys in the PARLAY_API_KEY secret (the phone's "send my API keys" writes them all); tools/parlay.py finds the biggest one by its own credits_total.
# Tasks (workflow_dispatch):
#   plans    each key's tier and credits (log only, keys shown as #N)
#   probe    one call to every Pro/live/arb endpoint; the answers (keyless, trimmed) go to the `parlay-samples` Release so parsers are checked against real shapes (about 60 credits)
on:
  workflow_dispatch:
    inputs:
      task:
        description: "plans | probe"
        default: "plans"

permissions:
  contents: write

concurrency:
  group: parlay-probe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: ParlayAPI task
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ github.event.inputs.task || 'plans' }}
        run: |
          set -u
          python3 -I tools/parlay.py selftest
          case "$TASK" in
            plans) python3 -I tools/parlay.py plans ;;
            probe)
              python3 -I tools/parlay.py probe out/parlay
              if [ -f out/parlay/REPORT.txt ]; then
                gh release view parlay-samples >/dev/null 2>&1 || gh release create parlay-samples --title "ParlayAPI Pro samples (keyless)" --notes "Real answers of the Pro, live and arb endpoints, trimmed; written by .github/workflows/parlay.yml (task probe)."
                gh release upload parlay-samples out/parlay/* --clobber
              fi ;;
          esac
