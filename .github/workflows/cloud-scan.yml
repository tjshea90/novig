name: Cloud scan (Vigilant engine on GitHub)

# Tj, 2026-10-14: "Put vigilant scans on GitHub runners. Outsource as much Internet bandwidth and processing power as possible to GitHub ... use the phone only to set the settings and retrieve the scanned results."
# This job IS the scan: the `cloud` module runs Vigilant's own Scanner and every fair-odds feed that is switched on (keys from repository secrets), under the settings the phone writes to the
# `cloud-config` branch (settings.json), and publishes the +EV list to the `cloud-feed` branch (feed.json.gz + status.json, ONE commit force-pushed each time: the branch never grows). It places NO order.
# The phone polls cloud-feed with its token. Rules (research/cloud_scan_2026-10-14.md, CLAUDE.md "Cloud scan"):
#   - the phone's switch is the master: settings.json "on": false => the gate step ends the run in seconds (no Java, no Gradle, no API call), and a running engine idles and ends itself;
#   - a job is capped at 6 h, so each run hands over to the next one (a self-dispatch at the end) and a 15-minute schedule is only the backstop (it starts an engine only when none is running); one engine at a time (concurrency group on the engine job);
#   - every pass's changed rows (the EDGE LOG) are gzipped to the `cloud-archive-YYYY-MM-DD` Release every 20 minutes and at the end (permanent, never delete), for Claude to analyse.
# Repository secrets used (all optional; an API is used only if its switch is on in the phone's settings AND its secret exists): SGO_API_KEY, ODDSPAPI_API_KEY, ODDSPAPI_FREE_API_KEY, UNABATED_API_KEY,
# PINNWIRE_API_KEY, PINNAPI_API_KEY, PROPLINE_API_KEY, ODDS_API_KEY, PARLAY_API_KEY, BOLTODDS_API_KEY (several keys: comma separated), and (Tj, 2026-10-15) the engine's own Novig READ-ONLY key: NOVIG_READ_KEY_ID + NOVIG_READ_KEY_PEM
# (a `trading::read` key minted for the engine: it cannot trade or move money). NEVER put Pinnodds, Kalshi's private key, Novig's trading key or its management key here (a socket that one connection owns, or a key that can trade, stays on the phone).
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run scans before it hands over (max 340)"
        default: "340"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  # The gate is a job of its own, with no concurrency group, so the 15-minute schedule never queues a second engine behind a running one (it used to leave a cancelled run every 15 minutes in the Actions list):
  # it ends in seconds unless the phone's switch is on AND no other engine is running. A manual start or a hand-over always goes on to the engine job, which waits its turn in the concurrency group.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Is the phone's switch on, and is no other engine running?
        id: gate
        run: |
          RUN=false
          if git fetch -q --depth=1 origin cloud-config 2>/dev/null; then
            ON=$(git show FETCH_HEAD:settings.json 2>/dev/null | python3 -c "import json,sys; print(str(json.load(sys.stdin).get('on', False)).lower())" 2>/dev/null || echo false)
            echo "phone switch: on=$ON"
            [ "$ON" = "true" ] && RUN=true
          else
            echo "no cloud-config branch yet: the phone has never switched the cloud scan on"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$RUN" = "true" ]; then
            OTHERS=$(gh run list --workflow cloud-scan.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length" 2>/dev/null || echo 0)
            echo "other engines running: $OTHERS"
            [ "$OTHERS" != "0" ] && RUN=false
          fi
          # A manual start (the phone's Start button, a hand-over, Claude) always runs: the engine itself idles out if the switch is off.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then RUN=true; fi
          # The engine's hours (Tj, 2026-10-15): 08:00 inclusive to 01:00 exclusive the next morning (Tj, 2026-10-16), America/New_York, for the schedule AND for dispatches (a hand-over at 21:59 must not start an engine).
          # The phone's switch settings.gates.cloudHours (default true) turns the window off. Same rule as data/.../cloud/EngineHours.kt.
          if [ "$RUN" = "true" ]; then
            HOURS=$(python3 - <<'PY'
          import json, subprocess, datetime
          from zoneinfo import ZoneInfo
          use = True
          try:
              txt = subprocess.run(["git", "show", "FETCH_HEAD:settings.json"], capture_output=True, text=True).stdout
              use = bool(json.loads(txt).get("settings", {}).get("gates", {}).get("cloudHours", True))
          except Exception:
              pass
          # Run / Stop by hand from the phone (TCL74, Tj 2026-10-17): manualRunUntilMs opens the window outside its hours, manualStopUntilMs keeps the engine off until the next scheduled opening. Both lapse by themselves.
          import time
          run_until = stop_until = 0
          try:
              c = json.loads(txt)
              run_until, stop_until = int(c.get("manualRunUntilMs", 0)), int(c.get("manualStopUntilMs", 0))
          except Exception:
              pass
          now_ms = int(time.time() * 1000)
          now = datetime.datetime.now(ZoneInfo("America/New_York")).time()
          if now_ms < stop_until:
              print("closed")
          else:
              print("open" if (not use) or now_ms < run_until or (now >= datetime.time(8, 0) or now < datetime.time(1, 0)) else "closed")
          PY
            )
            echo "engine hours: $HOURS"
            [ "$HOURS" = "closed" ] && RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  engine:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: cloud-scan
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Archive loop (every 20 min, in the background)
        run: |
          cat > archive.sh <<'SH'
          #!/usr/bin/env bash
          # Gzips the engine's journals and uploads them to the day's cloud-archive Release. Safe to run any time; --clobber replaces the same name.
          D="$(date -u +%Y-%m-%d)"; TAG="cloud-archive-$D"; mkdir -p arch
          for f in out/cloud/*.jsonl; do [ -f "$f" ] && gzip -9 -c "$f" > "arch/$(basename "$f" .jsonl)-run${GITHUB_RUN_ID}.jsonl.gz"; done
          for f in out/cloud/stall-*.txt; do [ -f "$f" ] && gzip -9 -c "$f" > "arch/$(basename "$f" .txt).txt.gz"; done
          [ -f out/cloud-engine.log ] && gzip -9 -c out/cloud-engine.log > "arch/engine-log-run${GITHUB_RUN_ID}.txt.gz"
          ls arch/* >/dev/null 2>&1 || exit 0
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Cloud scan archive $D" --prerelease --latest=false --target main --notes "Raw journals of the GitHub cloud scan, $D (UTC): edge rows (every listed bet when its fair or price moved) per run. Permanent: never delete (research/cloud_scan_2026-10-14.md)." >/dev/null 2>&1 || true
          fi
          gh release upload "$TAG" arch/* --clobber >/dev/null 2>&1 || echo "archive upload failed"
          SH
          chmod +x archive.sh
          nohup bash -c 'while true; do sleep 1200; ./archive.sh; done' >/dev/null 2>&1 &

      - name: Engine
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODDSPAPI_FREE_API_KEY: ${{ secrets.ODDSPAPI_FREE_API_KEY }}
          UNABATED_API_KEY: ${{ secrets.UNABATED_API_KEY }}
          PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
          PINNAPI_API_KEY: ${{ secrets.PINNAPI_API_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          BOLTODDS_API_KEY: ${{ secrets.BOLTODDS_API_KEY }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_KEY_PEM: ${{ secrets.KALSHI_KEY_PEM }}
          NOVIG_READ_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}
          NOVIG_READ_KEY_PEM: ${{ secrets.NOVIG_READ_KEY_PEM }}
          # the Vigilant subaccount's trading key (Tj, 2026-10-15): used only when the phone's cloud trading switch is paper or live (TCL20d); never the management key
          NOVIG_TRADE_KEY_ID: ${{ secrets.NOVIG_TRADE_KEY_ID }}
          NOVIG_TRADE_KEY_PEM: ${{ secrets.NOVIG_TRADE_KEY_PEM }}
          GITHUB_TOKEN: ${{ github.token }}
          MINUTES: ${{ github.event.inputs.minutes || '340' }}
        run: |
          set -o pipefail
          ./gradlew :cloud:run --no-daemon --no-configure-on-demand --console=plain --args="--minutes $MINUTES --out out --pub pub --cfg ." 2>&1 | tail -n 600

      - name: Summary
        if: always()
        run: |
          { echo '### Cloud scan'; echo '```'; tail -n 40 out/cloud-engine.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Final archive
        if: always()
        continue-on-error: true
        run: bash archive.sh

      # Hand over: the next run queues behind this one (same concurrency group) and starts the moment this ends. Not when the engine ended because the phone switched it off.
      - name: Hand over to the next run
        if: always()
        run: |
          END=$(cat out/end 2>/dev/null || echo UNKNOWN)
          echo "engine ended: $END"
          # TIME_UP: this job's time is over. ADDRESS: Novig refused this runner's internet address (data-center addresses are fine to Novig, one in a restricted state or on a list is not): draw another runner
          # (the engine limits itself to 5 in a row, then one an hour: cloud/ AddressWatch). Not IDLE: the phone switched the engine off.
          if [ "$END" = "TIME_UP" ] || [ "$END" = "ADDRESS" ] || [ "$END" = "STALL" ]; then gh workflow run cloud-scan.yml --ref main; fi
