name: Export my keys (encrypted)

# Tj, 2026-10-28 (KX1): "make the github engine send all the api keys to me ... so I can enter as many keys back into the app".
# The repo is PUBLIC, so the file is encrypted: AES-256-GCM under a key from PBKDF2(secret KEYS_EXPORT_PASSPHRASE).
# Set that secret first (Settings > Secrets and variables > Actions, 16+ characters). No keys are ever printed in clear.
# Open the result with tools/keys_decrypt.html (offline) or `python3 -I tools/keys_export.py decrypt keys.enc.json`.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keys-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt every secret
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          PASSPHRASE: ${{ secrets.KEYS_EXPORT_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then echo "Create the repository secret KEYS_EXPORT_PASSPHRASE (16+ characters) first."; exit 1; fi
          python3 -m pip install -q cryptography
          python3 -I tools/keys_export.py export keys.enc.json
          {
            echo '### Encrypted keys (safe to read: ciphertext only)'
            echo 'Paste this into tools/keys_decrypt.html with your passphrase:'
            echo '```'; cat keys.enc.json; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the encrypted file for the app (ciphertext only)
        uses: actions/github-script@v7
        with:
          script: |
            // The Vigilant app reads this one file (Settings > Cloud scan > Bring my API keys back) and opens it on the phone with the passphrase.
            const fs = require('fs');
            const content = fs.readFileSync('keys.enc.json').toString('base64');
            const { owner, repo } = context.repo;
            const base = (await github.rest.repos.get({ owner, repo })).data.default_branch;
            let sha;
            try { sha = (await github.rest.repos.getContent({ owner, repo, path: 'keys.enc.json', ref: 'keys-export' })).data.sha; }
            catch (e) {
              try { await github.rest.git.getRef({ owner, repo, ref: 'heads/keys-export' }); }
              catch (e2) {
                const head = (await github.rest.git.getRef({ owner, repo, ref: 'heads/' + base })).data.object.sha;
                await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/keys-export', sha: head });
              }
            }
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: 'keys.enc.json', branch: 'keys-export', message: 'encrypted keys export', content, sha });
      - uses: actions/upload-artifact@v4
        with:
          name: keys-encrypted
          path: keys.enc.json
          retention-days: 1
