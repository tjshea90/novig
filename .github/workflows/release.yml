name: Release

# Builds a SIGNED release APK and publishes it as a GitHub Release — the actual deliverable
# CLAUDE.md's "Releasing" section describes (as opposed to ci.yml's assembleDebug build, which
# only exists to verify the app compiles). Manual trigger only: a release is a deliberate act,
# never a side effect of a routine push.
#
# No secrets needed — signs with app/keystore/vigilant-debug.jks, committed directly into the
# repo (Tj's explicit call, 2026-09-20, matching fantasy-football's precedent). See BRIEF.md's
# keystore section for why, and app/build.gradle.kts's signingConfigs comment for the mechanics.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        # Same approach as ci.yml — see that file's comment for why (android-actions/setup-android
        # is broken; the SDK GitHub-hosted runners already ship is used directly instead).
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/versionName = "([^"]+)"/\1/')
          VERSION_CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | sed -E 's/versionCode = ([0-9]+)/\1/')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing tag/release
        # Checks the REMOTE state, not a local `git rev-parse` — real bugs found 2026-09-22
        # shipping v0.3.2, both from the same root cause: cancelling a stuck run doesn't stop an
        # in-flight step instantly, so a step that raced ahead before cancellation landed can
        # leave real, orphaned GitHub state behind.
        #   1. actions/checkout's shallow clone doesn't reliably see a tag pushed moments earlier
        #      by a different run, so a local-only tag check can false-negative and collide with
        #      it. Fixed: check the remote directly (`git ls-remote`).
        #   2. `softprops/action-gh-release` can leave a DRAFT release behind if cancelled mid-
        #      creation — `gh release view <tag>` matches by the release's `tag_name` FIELD, which
        #      can be set even when the release ended up attached to a synthetic `untagged-...`
        #      ref rather than the real tag (exactly what happened: `gh release view` found it and
        #      this step wrongly refused, treating leftover draft cruft as a real shipped
        #      version). This project never intentionally creates a draft release — the action
        #      publishes immediately by default — so any draft matching this tag name is always
        #      safe to delete outright, never real state to protect.
        # Net effect: self-heals both provably-safe leftover cases (a draft release with no real
        # attached tag; a bare tag with no release) automatically; anything genuinely published
        # still refuses exactly as before.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            echo "::warning::$TAG has a leftover DRAFT release (from a cancelled/interrupted prior run) — deleting it and proceeding."
            gh release delete "$TAG" --repo "$REPO" --yes
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$TAG already has a published GitHub Release — bump versionName/versionCode in app/build.gradle.kts before releasing again."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::$TAG exists as a bare tag with no GitHub Release (leftover from a cancelled/interrupted prior run) — deleting it and proceeding."
            git push origin ":refs/tags/$TAG"
          fi

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify the signing certificate matches BRIEF.md's recorded fingerprint
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found after assembleRelease"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signing-info.txt
          # apksigner prints the digest as continuous lowercase hex, no colons — unlike keytool's
          # colon-separated uppercase (which is what BRIEF.md records, matching Android tooling
          # convention there). Normalize both sides before comparing rather than assume a format.
          EXPECTED="AB:22:07:A8:6C:4E:59:18:BB:C1:A2:20:04:FB:14:42:B2:86:6E:6E:5A:B0:C3:D3:27:A7:EE:0E:AA:98:5C:C1"
          EXPECTED_NORMALIZED=$(echo "$EXPECTED" | tr -d ':' | tr 'A-Z' 'a-z')
          ACTUAL_NORMALIZED=$(grep -oE '[0-9a-fA-F]{64}' signing-info.txt | tr 'A-Z' 'a-z' | head -1)
          if [ "$ACTUAL_NORMALIZED" != "$EXPECTED_NORMALIZED" ]; then
            echo "::error::Signing certificate does not match the fingerprint recorded in BRIEF.md — the committed keystore was changed unexpectedly. Refusing to publish."
            exit 1
          fi
          echo "Signing certificate verified against BRIEF.md's recorded fingerprint."
          mkdir -p release-out
          cp "$APK" "release-out/vigilant-${{ steps.version.outputs.tag }}.apk"

      - name: Create the release tag (server-side — this account's containers get HTTP 403 pushing refs/tags/*)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Vigilant ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Vigilant ${{ steps.version.outputs.tag }}"
          files: release-out/*.apk
          body: |
            Signed release build of Vigilant (versionCode ${{ steps.version.outputs.code }}).

            Signing certificate SHA-256:
            `AB:22:07:A8:6C:4E:59:18:BB:C1:A2:20:04:FB:14:42:B2:86:6E:6E:5A:B0:C3:D3:27:A7:EE:0E:AA:98:5C:C1`

            Signed with a committed, non-secret keystore (see BRIEF.md) — fine for sideloading, not intended for Play Store distribution.

            Live Novig prices come from Novig's official public API (no key needed). Fair odds need a free The Odds API key, added in Settings.
