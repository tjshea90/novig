// Vigilant's data/engine models are immutable data classes (vals only, lists never mutated
// after construction), but they live in plain-Kotlin modules the Compose compiler can't see into,
// so it would treat them as unstable and redraw every card on every 2s price tick. Declaring
// them stable lets unchanged cards skip recomposition (compared with equals()).
com.tjshea.vigilant.data.**
com.tjshea.vigilant.engine.**
kotlin.collections.*
