<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - BoltOdds | Reach Our Team</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="./images/api_favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/api_favicon.png" />

</head>
<body>

  <header class="header">
        <div class="container">
            <div class="nav-brand">
                <a href='/' style='display:flex;align-items:center;gap:inherit;text-decoration:none;color:inherit;'>
                    <img src="./images/api_favicon.png" alt="API Logo" class="logo" />
                    <h3>BoltOdds</h3>
                </a>
            </div>


            <div class="hamburger" id="hamburger">
                ☰
            </div>
            <!-- <div class="nav-container"> -->

            <nav class="nav-menu">
                <a href='/'>Home</a>
                <a href='/pricing'>Pricing</a>
                <a href='/docs'>Documentation</a>
                <a href='/contact'>Contact</a>
                <a href="https://discord.gg/JTgtfJCv7f" target="_blank">
                    Discord
                </a>

                <div class="account-buttons">
                    <a class='btn-primary' href='/signup'>Sign Up</a>
                    <a class='btn-primary' href='/signin' id='login'>Login</a>
                </div>
                <a href='/account' id='account'>Account</a>
            </nav>

        </div>
    </header>


  <section class="form-section">
  <h1>Contact Us</h1>
  <p>Got a question or request? Reach out and we’ll get back to you as soon as possible.</p>

  <div class="contact-form">
    <div class="form-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="John Doe">
    </div>
    <div class="form-group">
      <label for="email">Your Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="message">Your Message</label>
      <textarea id="message" rows="6" placeholder="How can we help?"></textarea>
    </div>
    <button id="sendMessageBtn">Send Message</button>
  </div>
</section>

<footer class="footer">
        
    <div class="footer-bottom">
        <p>&copy; <span id="year"></span> Spro Technologies Inc. All rights reserved.</p>
    </div>
    
</footer> 

<script>
    document.getElementById("year").textContent = new Date().getFullYear();
</script>

  
<script src="contact.js"></script>
</body>
</html>
