# Required for any project using AndroidX artifacts (androidx.core, Compose, etc.) — without
# this, AGP resolves against the legacy support-library namespace and dependency resolution
# breaks. Not optional.
android.useAndroidX=true
# Recommended alongside it: each module gets its own R class instead of one merged R class,
# which is both faster and avoids resource-id collisions across modules.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
